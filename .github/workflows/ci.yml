name: CI

# Fast, offline checks only. Tests marked `network` talk to IRSA/Gaia/CDS, which
# return 5xx often enough to block merges for no reason; run those locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lockfile, lint, offline tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
      # Fails if uv.lock is out of date with pyproject.toml; also builds the package.
      - name: Install (locked)
        run: uv sync --locked
      # Real bugs only (syntax errors, undefined names), no style rules.
      - name: Lint
        run: uvx ruff@0.17.5 check --select E9,F63,F7,F82 --output-format=github .
      # Exit code 5 means "no tests collected": allowed so branches that have
      # only network tests still pass.
      - name: Offline tests
        run: uv run --locked pytest -m "not network" -q || [ $? -eq 5 ]

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Branches cut before the frontend landed have no frontend/ directory.
      - id: detect
        run: |
          if [ -f frontend/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, test, build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
