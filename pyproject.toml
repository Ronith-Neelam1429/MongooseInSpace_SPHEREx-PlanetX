[project]
name = "spherex-planetx"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "astropy-healpix>=2.0.1",
    "astroquery>=0.4.11",
    "certifi>=2026.10.23",
    "fastapi>=0.163.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyvo>=1.10.0",
    "reproject>=0.21.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test talks to an external data service"]
addopts = "-ra --strict-markers"
timeout = 180  # pyvo SIA queries have no timeout and can hang

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "planetx"
